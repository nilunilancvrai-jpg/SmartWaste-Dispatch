
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">

    <title>SmartWaste Dispatch</title>

    <meta
        name="description"
        content="Find nearby garbage bins with available capacity."
    >

    <!-- Our own CSS file -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Leaflet CSS: styles for the interactive map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
/>

</head>

<body>

    <!-- =====================================
         HEADER
         App branding and location button
    ====================================== -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-icon" aria-hidden="true">♻</div>

            <div>
                <h1>SmartWaste</h1>
                <p>Cleaner streets, smarter cities</p>
            </div>
        </div>

        <button
            id="locateBtn"
            class="location-btn"
            type="button"
        >
            ◎ Locate Me
        </button>

    </header>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->
    <main>

        <!-- MAP SECTION -->
        <section
            class="map-section"
            aria-labelledby="mapTitle"
        >

            <div class="map-heading">

                <div>
                    <h2 id="mapTitle">Find a Nearby Bin</h2>
                    <p>Discover bins with available capacity.</p>
                </div>

                <span class="live-label">
                    <span aria-hidden="true"></span>
                    DEMO
                </span>

            </div>

            <!-- Leaflet will render the interactive map here -->
            <div
                id="map"
                aria-label="Map showing nearby garbage bins"
            ></div>

            <!-- Map marker legend -->
            <div class="map-legend">

                <span>
                    <i class="dot green"></i>
                    Available
                </span>

                <span>
                    <i class="dot orange"></i>
                    Almost Full
                </span>

                <span>
                    <i class="dot red"></i>
                    Full
                </span>

            </div>

        </section>


        <!-- RECOMMENDED BIN SECTION -->
        <section
            class="results"
            aria-labelledby="resultTitle"
        >

            <div class="section-heading">

                <div>
                    <h2 id="resultTitle">Recommended Bin</h2>
                    <p>Nearest suitable bin for you</p>
                </div>

                <button
                    id="refreshBtn"
                    class="refresh-btn"
                    type="button"
                >
                    ↻ Refresh
                </button>

            </div>

            <!--
                JavaScript will insert the recommended bin here.
                It will display the name, address, distance,
                fill percentage, and directions link.
            -->
            <div id="binCard" class="bin-card">

                <p class="loading">
                    Loading nearby bins...
                </p>

            </div>

            <!-- GPS messages and demo-data notices -->
            <p
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            >
                Sample bin data is being used.
                Select Locate Me to use your current location.
            </p>

        </section>

    </main>


    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->
    <nav class="bottom-nav" aria-label="Main navigation">

        <button
            class="nav-item active"
            id="exploreBtn"
            type="button"
        >
            <span aria-hidden="true">⌖</span>
            Explore
        </button>

        <button
            class="nav-item"
            id="allBinsBtn"
            type="button"
        >
            <span aria-hidden="true">▦</span>
            All Bins
        </button>

        <button
            class="nav-item"
            id="locationNavBtn"
            type="button"
        >
            <span aria-hidden="true">◎</span>
            My Location
        </button>

    </nav>


    <!-- =====================================
         JAVASCRIPT LIBRARIES AND MODULES

         Load dependencies before app.js.
         These files will be created in the
         folders you already made.
    ====================================== -->

    <!-- Leaflet library must load before map code -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- 1. Sample bin data -->
    <script src="data/sample-bins.js"></script>

    <!-- 2. Utility and service modules -->
    <script src="js/distance.js"></script>
    <script src="js/location.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/binService.js"></script>

    <!-- 3. Recommendation and worker features -->
    <script src="js/recommendation.js"></script>
    <script src="js/workerActions.js"></script>
     
    <script src="js/routing.js"></script>

    <!-- 4. Start the application last -->
    <script src="js/app.js"></script>

</body>

</html>
